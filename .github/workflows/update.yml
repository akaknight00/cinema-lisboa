name: Atualizar sessões
on:
  schedule:
    - cron: "0 6 * * *"   # todos os dias às 06:00 UTC
  workflow_dispatch:       # permite correr à mão
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Guardar alterações
        run: |
          git config user.name "sessoes-bot"
          git config user.email "sessoes-bot@users.noreply.github.com"
          git add docs/sessions.json
          git diff --staged --quiet || (git commit -m "Atualizar sessões" && git push)
